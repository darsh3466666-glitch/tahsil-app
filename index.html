<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحصيل — منصة إدارة التحصيل والمحصلين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231E40AF'/%3E%3Cpath d='M12 6v12M7 10h10' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo" id="brandLogo" tabindex="0" role="button" aria-label="لوحة التحكم"></div>
      <div>
        <div class="brand-name">تحصيل</div>
        <div class="brand-sub">منصة المبيعات والمقبوضات</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        لوحة التحكم
      </button>
      <button class="nav-item" data-view="route">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="5" r="2.2"/><path d="M8.2 19H15a3 3 0 0 0 3-3v-8.8"/><path d="m6 14-2 2 6 6 2-2"/></svg>
        <span>خط سير اليوم</span>
        <span class="nav-badge" id="navRouteCount" hidden></span>
      </button>
      <button class="nav-item" data-view="collectors">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3.4"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17.5" cy="8" r="2.6"/><path d="M17 14.6c2.4.3 4.1 1.9 4.6 4.4"/></svg>
        تقييم المحصلين
      </button>
      <button class="nav-item" data-view="cashflow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5.5H9.8a2.8 2.8 0 0 0 0 5.6h4.4a2.8 2.8 0 0 1 0 5.6H7"/></svg>
        التدفق النقدي
      </button>
      <button class="nav-item" data-view="cycle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        عملاء بالدورة
      </button>
    </nav>
    <div class="sidebar-footer">
      <div class="sync-status" id="syncStatus">
        <span class="dot" id="syncDot"></span>
        <span id="syncText">جارٍ الاتصال...</span>
      </div>
      <div class="last-update" id="lastUpdate">—</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="القائمة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 class="page-title" id="pageTitle">لوحة التحكم</h1>
      <div class="topbar-actions">
        <div class="date-today" id="dateToday"></div>
        <button class="icon-btn" id="bellBtn" aria-label="التنبيهات">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="bell-dot" id="bellDot" hidden></span>
        </button>
        <button class="icon-btn" id="soundBtn" aria-label="كتم الصوت">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9.4 9.4 0 0 1 0 14"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" aria-label="الوضع الليلي">
          <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="icon-btn" id="refreshBtn" aria-label="تحديث">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </header>

    <div class="content" id="content">
      <div class="view" id="view-dashboard"><div class="loading">جاري تحميل البيانات...</div></div>
      <div class="view" id="view-route" hidden></div>
      <div class="view" id="view-collectors" hidden></div>
      <div class="view" id="view-cashflow" hidden></div>
      <div class="view" id="view-cycle" hidden></div>
    </div>
  </main>
</div>

<div class="toast-area" id="toastArea"></div>

<!-- تنبيه السداد المنبثق -->
<div class="modal" id="paymentModal" hidden>
  <div class="modal-card">
    <div class="modal-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5.5H9.8a2.8 2.8 0 0 0 0 5.6h4.4a2.8 2.8 0 0 1 0 5.6H7"/></svg>
    </div>
    <h2 id="modalTitle">سداد جديد</h2>
    <p class="modal-customer" id="modalCustomer"></p>
    <p class="modal-amount" id="modalAmount"></p>
    <div class="modal-actions">
      <button class="btn btn-primary" id="modalClose">حسناً</button>
      <button class="btn btn-ghost" id="modalSilence">إسكات مؤقت</button>
    </div>
  </div>
</div>

<!-- نافذة تعديل رد العميل السريع وقوالب الواتساب -->
<div class="modal" id="responseModal" hidden>
  <div class="modal-card response-modal-card">
    <div class="modal-head">
      <h2 id="respModalTitle">تحديث رد العميل</h2>
      <button type="button" class="modal-close-btn" id="respModalCloseBtn" aria-label="إغلاق">&times;</button>
    </div>
    <p class="modal-subtitle" id="respModalCustomer"></p>
    <div class="form-group" style="text-align: right; margin-bottom: 12px;">
      <label style="font-size: 0.82rem; font-weight: 700; opacity: 0.8; margin-bottom: 6px; display: block;">قوالب ردود جاهزة وسريعة:</label>
      <div class="preset-chips" id="respPresetChips">
        <button type="button" class="chip-btn" data-preset="وعد بالسداد غداً إن شاء الله">وعد غداً</button>
        <button type="button" class="chip-btn" data-preset="سيسدد الأسبوع القادم">الأسبوع القادم</button>
        <button type="button" class="chip-btn" data-preset="تم استلام دفعة نقداً">استلام دفعة</button>
        <button type="button" class="chip-btn" data-preset="المحل مغلق / لم يتم العثور عليه">المحل مغلق</button>
        <button type="button" class="chip-btn" data-preset="لا يرد على الهاتف / غير متاح">لا يرد</button>
        <button type="button" class="chip-btn" data-preset="طلب مهلة حتى نهاية الشهر">طلب مهلة</button>
        <button type="button" class="chip-btn" data-preset="يرفض السداد / نزاع فواتير">نزاع فواتير</button>
      </div>
    </div>
    <div class="form-group" style="text-align: right; margin-bottom: 14px;">
      <label for="respModalInput" style="font-size: 0.82rem; font-weight: 700; opacity: 0.8; margin-bottom: 6px; display: block;">نص الرد (الوارد من المحصل عبر الواتساب):</label>
      <textarea id="respModalInput" class="modal-textarea" rows="3" placeholder="الصق رد العميل هنا..."></textarea>
    </div>
    <div class="form-group" style="text-align: right; margin-bottom: 16px;">
      <label for="respModalComm" style="font-size: 0.82rem; font-weight: 700; opacity: 0.8; margin-bottom: 6px; display: block;">تحديث حالة التواصل:</label>
      <select id="respModalComm" class="select" style="width: 100%;">
        <option value="تم التواصل">تم التواصل</option>
        <option value="عميل مستجيب">عميل مستجيب</option>
        <option value="عميل غير مستجيب">عميل غير مستجيب</option>
        <option value="لم يتم التواصل">لم يتم التواصل</option>
        <option value="لم يذهب إليه المحصل">لم يذهب إليه المحصل ❌</option>
      </select>
    </div>
    <div class="modal-actions" style="justify-content: flex-end;">
      <button type="button" class="btn btn-ghost" id="respModalCancel">إلغاء</button>
      <button type="button" class="btn btn-primary" id="respModalSave">حفظ الرد والتحديث ✓</button>
    </div>
  </div>
</div>

<!-- نافذة سداد سريع لعميل معين -->
<div class="modal" id="quickPayModal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2>تسجيل سداد سريع</h2>
      <button type="button" class="modal-close-btn" id="quickPayCloseBtn" aria-label="إغلاق">&times;</button>
    </div>
    <p class="modal-subtitle" id="quickPayCustomerName"></p>
    <div class="quick-pay-meta" id="quickPayMeta"></div>
    <form id="quickPayForm" style="margin-top: 14px; text-align: right;">
      <div class="form-group" style="margin-bottom: 12px;">
        <label style="font-size: 0.82rem; font-weight: 700; opacity: 0.8; margin-bottom: 6px; display: block;">المبلغ المسدد (ج.م):</label>
        <input type="number" id="quickPayAmountInput" class="search-input" style="width: 100%; font-size: 1.1rem; font-weight: 700;" placeholder="0" min="1" step="any" required>
      </div>
      <div class="form-group" style="margin-bottom: 16px;">
        <label style="font-size: 0.82rem; font-weight: 700; opacity: 0.8; margin-bottom: 6px; display: block;">المحصل القائم بالتحصيل:</label>
        <select id="quickPayCollectorSelect" class="select" style="width: 100%;"></select>
      </div>
      <div class="modal-actions" style="justify-content: flex-end;">
        <button type="button" class="btn btn-ghost" id="quickPayCancel">إلغاء</button>
        <button type="submit" class="btn btn-primary">تأكيد السداد ✓</button>
      </div>
    </form>
  </div>
</div>

<!-- نافذة ملخص خط السير للواتساب -->
<div class="modal" id="whatsappModal" hidden>
  <div class="modal-card response-modal-card">
    <div class="modal-head">
      <h2 id="waModalTitle">📋 رسالة خط السير للواتساب</h2>
      <button type="button" class="modal-close-btn" id="waModalCloseBtn" aria-label="إغلاق">&times;</button>
    </div>
    <p class="modal-subtitle">يمكنك نسخ هذا النص وإرساله فوراً للمحصل على الواتساب ليبدأ به يومه</p>
    <textarea id="waModalText" class="modal-textarea" rows="10" readonly style="font-size: 0.85rem; font-family: monospace; direction: rtl;"></textarea>
    <div class="modal-actions" style="justify-content: space-between; margin-top: 12px;">
      <span id="waCopyAlert" style="font-size: 0.82rem; font-weight: 700; color: var(--success); opacity: 0; transition: opacity 0.2s;">تم النسخ إلى الحافظة! ✓</span>
      <div style="display: flex; gap: 8px;">
        <button type="button" class="btn btn-ghost" id="waModalClose">إغلاق</button>
        <button type="button" class="btn btn-primary" id="waModalCopy">نسخ النص 📋</button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
